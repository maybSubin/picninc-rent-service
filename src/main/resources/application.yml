spring:
  datasource:
    url: jdbc:mysql://localhost:3306/picnic
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    mongodb:
      uri: mongodb://localhost:27017/picnic
      auto-index-creation: true

picnic:
  sample-data:
    enabled: true
